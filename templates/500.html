{% load static %}
<html>
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>500 - Internal Server Error</title>

    <link href="{% static 'img/coat_of_arms.png' %}" rel="icon">
    <link href="{% static 'vendor/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'vendor/bootstrap-icons/bootstrap-icons.css' %}" rel="stylesheet">
    <link href="{% static 'css/main.css' %}" rel="stylesheet">

    <style>
        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #F6F4E9 0%, #f6f2dd 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .error-container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            max-width: 500px;
        }

        .error-code {
            font-size: 96px;
            font-weight: 700;
            color: #DD3209;
        }

        .error-message {
            font-size: 24px;
            margin-bottom: 20px;
            color: #0a1931;
        }

        .error-description {
            font-size: 14px;
            color: #6c757d;
            margin-bottom: 30px;
        }

        .back-home-btn {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #0c0d0e 0%, #222d3a 100%);
            color: white;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
        }

        .back-home-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(42, 82, 152, 0.3);
        }

        @media (max-width: 576px) {
            .error-code {
                font-size: 72px;
            }

            .error-message {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="error-container">
        <div class="error-code">500</div>
        <div class="error-message">Internal Server Error</div>
        <div class="error-description">
            Oops! Something went wrong on our end. Please try again later.
        </div>
        <a href="{% url 'dashboard' %}" class="back-home-btn">
            <i class="bi bi-house-door"></i> Back to Dashboard
        </a>
    </div>

</body>
</html>
