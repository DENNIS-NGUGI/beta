{% load static %}
<html>
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>BETA Dashboard - Forgot Password</title>

    <link href="{% static 'img/coat_of_arms.png' %}" rel="icon">
    <link href="{% static 'vendor/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'vendor/bootstrap-icons/bootstrap-icons.css' %}" rel="stylesheet">
    <link href="{% static 'css/main.css' %}" rel="stylesheet">

    <style>
        .login-section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            background: linear-gradient(135deg, #F6F4E9 0%, #f6f2dd 100%);
            padding: 80px 0;
        }

        .login-container {
            max-width: 600px;
            margin: 0 auto;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            padding: 40px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-label {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 8px;
            display: block;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #DD3209 0%, #982305 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2a5298;
            text-decoration: none;
            font-weight: 500;
        }

        .error-message {
            background: #fee;
            border: 1px solid #fcc;
            color: #c00;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .success-message {
            background: #e8f5e9;
            border: 1px solid #c8e6c9;
            color: #2e7d32;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }
    </style>
</head>

<body>

<section class="login-section">
    <div class="container login-container">
        <div class="login-card">

            <!-- Header -->
            <div class="login-header">
                <img src="{% static 'img/logo.png' %}" alt="Beta Logo" width="100%">
            </div>

            <!-- Django Messages -->
            {% if messages %}
                {% for message in messages %}
                    <div class="{% if message.tags == 'success' %}success-message{% else %}error-message{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <!-- Form Errors -->
            {% if form.errors %}
                <div class="error-message">
                    {{ form.email.errors }}
                </div>
            {% endif %}

            <!-- Forgot Password Form -->
            <form method="POST">
                {% csrf_token %}

                <div class="form-group">
                    <label class="form-label" for="{{ form.email.id_for_label }}">
                        {{ form.email.label }}
                    </label>
                    {{ form.email }}
                </div>

                <button type="submit" class="login-btn">
                    <i class="bi bi-envelope"></i>
                    Send Reset Link
                </button>
            </form>

            <a href="{% url 'login' %}" class="back-link">
                <i class="bi bi-arrow-left"></i> Back to Login
            </a>

        </div>
    </div>
</section>

</body>
</html>
