{% load static %}
<html>
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>BETA Dashboard - Reset Password</title>

    <link href="{% static 'img/coat_of_arms.png' %}" rel="icon">
    <link href="{% static 'vendor/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'vendor/bootstrap-icons/bootstrap-icons.css' %}" rel="stylesheet">
    <link href="{% static 'css/main.css' %}" rel="stylesheet">

    <style>
        .login-section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            background: linear-gradient(135deg, #F6F4E9 0%, #f6f2dd 100%);
            padding: 80px 0;
        }

        .login-container {
            max-width: 600px;
            margin: 0 auto;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            padding: 40px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-label {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 8px;
            display: block;
        }

        .password-input {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #6c757d;
            cursor: pointer;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #DD3209 0%, #982305 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .error-message {
            background: #fee;
            border: 1px solid #fcc;
            color: #c00;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }
    </style>
</head>

<body>

<section class="login-section">
    <div class="container login-container">
        <div class="login-card">

            <!-- Header -->
            <div class="login-header">
                <img src="{% static 'img/logo.png' %}" alt="Beta Logo" width="100%">
            </div>

            <!-- Form Errors Only -->
            {% if form.errors %}
                <div class="error-message">
                    {{ form.non_field_errors }}
                    {{ form.new_password1.errors }}
                    {{ form.new_password2.errors }}
                </div>
            {% endif %}

            <!-- Recover Password Form -->
            <form method="POST">
                {% csrf_token %}

                <div class="form-group">
                    <label class="form-label" for="{{ form.new_password1.id_for_label }}">
                        {{ form.new_password1.label }}
                    </label>
                    <div class="password-input">
                        {{ form.new_password1 }}
                        <button type="button" class="password-toggle toggle-password">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="{{ form.new_password2.id_for_label }}">
                        {{ form.new_password2.label }}
                    </label>
                    <div class="password-input">
                        {{ form.new_password2 }}
                        <button type="button" class="password-toggle toggle-password">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="login-btn">
                    <i class="bi bi-shield-lock"></i>
                    Reset Password
                </button>
            </form>

        </div>
    </div>
</section>

<script>
    // Toggle password visibility
    document.querySelectorAll('.toggle-password').forEach(button => {
        button.addEventListener('click', function () {
            const input = this.previousElementSibling;
            const icon = this.querySelector('i');

            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('bi-eye', 'bi-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('bi-eye-slash', 'bi-eye');
            }
        });
    });
</script>

</body>
</html>
